# TEMPORARY (2026-10-04; run on a push to this branch alone) - the account service answers 500 on sign-in (the deploy smoke's guest
# sign-in since 00:49 UTC; players' logins land back on the title). Reads the live Worker's own
# error log for ninety seconds of the players' own traffic and one refused login (it opens no
# account), and prints ONLY the service's '[account]' error lines (path and stack), the outcomes'
# counts and the database's size - no URL, address or body, this repository's Actions logs being
# public. To be deleted once the cause is known.
name: diag-accounts

on:
  push:
    branches:
      - ccr-1179df97-c4x5p3
    paths:
      - .github/workflows/diag-accounts.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER: npx --yes wrangler@4
    defaults:
      run:
        working-directory: server-account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The database's size and limits
        run: |
          set -uo pipefail
          $WRANGLER d1 info daggerfall-accounts 2>&1 | grep -v -i -E 'uuid|database_id|^\s*id\b' || true
      - name: The queries holding the database (D1 query insights, by total time, rows read and writes)
        run: |
          set -uo pipefail
          for by in time reads writes count; do
            echo "=== top by $by (sum) ==="
            $WRANGLER d1 insights daggerfall-accounts --sort-by "$by" --sort-type sum --limit 12 --json > /tmp/ins.json 2>/tmp/ins.err || true
            jq -c '.[]' /tmp/ins.json 2>/dev/null | cut -c1-700 || { head -c 3000 /tmp/ins.json; head -c 1500 /tmp/ins.err; }
          done
