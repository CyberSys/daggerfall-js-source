# The DOWNLOADABLE build (Desktop-App.md). Pushing a tag shaped
# app-v* builds the desktop shell's installers on all three OSes and
# attaches them to a GitHub Release at that tag - which is where the
# landing page's "On your desktop" section points. workflow_dispatch
# builds the same installers as run artifacts, for trying a build
# without cutting a release.
#
# The house gate rides in front: the `gate` job runs `npm run check`
# whole, and every OS leg `needs` it (a red suite never ships an
# installer any more than it ships the site). AUDIT 68: it was a step
# inside the ubuntu leg, and the windows/macos legs never waited for it.
#
# Doctrine unchanged: the installers carry the built site and the
# shell, NO game data - the app asks for the player's own ARENA2
# folder on first run, exactly as the website does.
name: release-desktop

# REL3 (2026-09-21, Mac: "is there a way to auto push a release on each
# merge?"): EVERY MAIN PUSH CUTS A RELEASE, from the same commit the
# site deploys. The version is DERIVED, never bumped by hand: MAJOR.MINOR
# from app/package.json's committed base, PATCH the count of commits on
# main - monotonic, reproducible from the commit, and no file to remember
# to touch. The marker file that used to name the tag and the REL1 gate
# that held it to the package version are retired with it: ONE shell
# variable names the number, and both the tag and the stamp electron-
# builder bakes in read it, which is the whole of REL1's lesson.
# A pushed app-v* tag and a dispatch with release_tag remain as manual
# doors (a re-cut, a hotfix off a branch) and take their version from
# the tag they name. Runs queue rather than cancel: a release half
# uploaded is worse than one late.
#
# REL4 (2026-09-29, Mac: "drastically improve the install experience"):
# THE RELEASE IS PUBLISHED WHOLE, ONCE. Each OS leg used to create-or-
# update the release itself, so the release went live when the FIRST leg
# finished (app-v0.1.4605: eighty-five seconds as `latest` with no
# Windows installer and no latest.yml), every leg appended its own copy
# of the generated notes (two or three per release, one sometimes lost
# to a race), and a leg dying after the gate would have left a partial
# `latest` standing. Now: `version` resolves REL3's one number once and
# every job reads it; the legs only BUILD and hand their files on; and
# `publish` - which runs only when every leg passed - checks the set is
# complete, writes the player-facing notes (the PATCH-NOTES-*.md the
# release brings, scripts/desktopRelease.mjs), stages a DRAFT carrying
# every file, and publishes it in one step. `latest` never names a
# release that is half there.
on:
  push:
    tags:
      - 'app-v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create a Release at (app-v*); empty = run artifacts only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # REL3: ONE NUMBER. The dispatch input or the pushed tag names it
  # outright; a main push derives it - MAJOR.MINOR from the committed
  # base, PATCH from `git rev-list --count HEAD`. A dispatch with no
  # tag is artifacts-only, as before. Both the release tag and the
  # version electron-builder stamps come from this one VERSION.
  # AUDIT 68: the dispatch input is READ from the environment, never
  # pasted into the script - a quote in it is text, not bash.
  # REL4: resolved ONCE, here, and read by every job below - three legs
  # and the publish job cannot disagree about a number none of them
  # computes.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.reltag.outputs.tag }}
      version: ${{ steps.reltag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REL3: the version is the commit count, which needs the whole history

      - name: Resolve release version
        id: reltag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -z "$TAG" ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            BASE=$(node -p "require('./app/package.json').version.split('.').slice(0,2).join('.')")
            TAG="app-v${BASE}.$(git rev-list --count HEAD)"
          fi
          case "$TAG" in app-v*) VERSION="${TAG#app-v}" ;; *) TAG=''; VERSION='' ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release tag: '${TAG:-<none - artifacts only>}'"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm ci
      - name: Gate (the whole suite, before any leg packages)
        run: npm run check

  build:
    needs: [version, gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No signing identities exist; without this electron-builder
      # hunts for one on macOS and fails the build looking.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Install shell dependencies
        run: npm ci
        working-directory: app

      # REL3: the stamp. app.getVersion() and the installers' own metadata
      # read package.json's version, so the release's number is written
      # there before electron-builder runs - from the SAME output the
      # tag is cut from. Not committed: the working tree is the runner's.
      - name: Stamp the version
        if: needs.version.outputs.version != ''
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: app

      # DA7: `--publish never` uploads nothing (the publish job attaches
      # the files), but with a publish PROVIDER in app/package.json
      # electron-builder still writes the updater's metadata - latest.yml
      # / latest-linux.yml and the blockmaps beside the installers, and
      # app-update.yml inside them - which is what electron-updater in
      # the shell reads back from the release at that tag. The
      # metadata rides the release with the installers, or the updater
      # finds nothing and every copy falls back to the notice.
      - name: Build installers
        run: npx electron-builder --publish never
        working-directory: app

      # REL4: a leg hands its files on and publishes nothing. When a
      # release follows, the publish job takes them within minutes and
      # the release holds them for good, so a day is kept (a re-run of a
      # failed publish); an artifacts-only run keeps its installers two
      # weeks for whoever asked for them.
      - name: Hand the installers on
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            app/release/*.AppImage
            app/release/*.exe
            app/release/*.dmg
            app/release/latest*.yml
            app/release/*.blockmap
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.tag != '' && 1 || 14 }}

  # REL4: ONE publish, and only when every leg passed - `needs: build`
  # waits for the whole matrix, and a failed leg skips this job, so no
  # partial release is ever cut.
  publish:
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the notes diff PATCH-NOTES-*.md against the previous release's tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect every leg's files
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      # REL5: every download the site links and every manifest an updater
      # reads, by the names app/lib/downloads.cjs promises - a set short
      # of any one publishes nothing.
      - name: The set is whole
        run: node scripts/desktopRelease.mjs check release

      - name: Write the notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/desktopRelease.mjs notes "$TAG" > release-notes.md

      # AUDIT 68: target_commitish cuts a NEW tag at the commit these
      # installers were built from. Without it GitHub cuts it at the
      # default branch's head at upload time - main has moved on by
      # then, and a dispatched hotfix branch's tag lands on main.
      # REL4: a DRAFT, so nothing is visible while the files upload.
      # The body is the patch notes; GitHub appends its generated list
      # of merged changes beneath them, once.
      - name: Stage the release as a draft, every file attached
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

      # One step from nothing to everything. It takes `latest` unless a
      # newer release already holds it - a hand re-cut of an old build
      # must not move every download link and updater back to it.
      - name: Publish it whole
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          MAKE_LATEST=$(node scripts/desktopRelease.mjs latest "$TAG" "$CURRENT")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest="$MAKE_LATEST" --silent
          echo "published $TAG (latest: $MAKE_LATEST)"
